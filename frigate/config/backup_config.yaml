mqtt:
  enabled: false

database:
  path: /config/frigate.db

ffmpeg:
  hwaccel_args: preset-intel-qsv-h264

detectors:
  cpu1:
    type: cpu
    num_threads: 3

record:
  enabled: true
  retain:
    days: 7
    mode: motion
  events:
    retain:
      default: 14

snapshots:
  enabled: true
  retain:
    default: 14

cameras:
  floodlight_front_driveway:
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.45:554/h264Preview_01_main
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.45:554/h264Preview_01_sub
          roles:
            - detect

    detect:
      width: 896
      height: 512
      fps: 5

  floodlight_backyard:
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.44:554/h264Preview_01_main
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.44:554/h264Preview_01_sub
          roles:
            - detect
    detect:
      width: 896
      height: 512
      fps: 5

  floodlight_sideyard:
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.47:554/h264Preview_01_main
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.47:554/h264Preview_01_sub
          roles:
            - detect
    detect:
      width: 896
      height: 512
      fps: 5

  doorbell:
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.43:554/h264Preview_01_main
          roles:
            - record
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.43:554/h264Preview_01_sub
          roles:
            - detect
      input_args: preset-rtsp-restream
    detect:
      width: 896
      height: 512
      fps: 5
