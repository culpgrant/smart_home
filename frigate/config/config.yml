mqtt:
  enabled: true
  host: 127.0.0.1
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

database:
  path: /config/frigate.db

ffmpeg:
  hwaccel_args: preset-vaapi

go2rtc:
  streams:
    floodlight_front_driveway:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.45:554/h264Preview_01_sub
    floodlight_backyard:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.44:554/h264Preview_01_sub
    floodlight_sideyard:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.47:554/h264Preview_01_sub
    doorbell:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.43:554/h264Preview_01_sub


# detectors:
#   cpu1:
#     type: cpu
#     num_threads: 3

detectors:
  ov:
    type: openvino
    device: GPU.0

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

objects:
  track:
    - person
    - car
    - dog
    - cat
    - bird

record:
  enabled: true
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14
  continuous:
    days: 0
  motion:
    days: 0

snapshots:
  enabled: true
  retain:
    default: 14

cameras:
  floodlight_front_driveway:
    ffmpeg:
      inputs:
        - path:
            rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.45:554/h264Preview_01_main
          roles:
            - record
        - path:
            rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.45:554/h264Preview_01_sub
          roles:
            - detect
    detect:
      enabled: true
      width: 896
      height: 512
      fps: 5

    objects:
      filters:
        car:
          min_score: 0.45
          min_area: 5000
          max_area: 100000
        person:
          min_score: 0.45

    zones:
      driveway:
        coordinates: 0.401,0.003,0.208,1,0.813,1,0.596,0.01
        loitering_time: 0
        friendly_name: Driveway
      front_yard:
        coordinates:
          0.623,0.105,0.781,0.19,0.879,0.298,0.97,0.571,0.923,0.876,0.88,0.987,0.818,1
        loitering_time: 0
