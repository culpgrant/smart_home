mqtt:
  enabled: false

database:
  path: /config/frigate.db

ffmpeg:
  hwaccel_args: preset-vaapi


# detectors:
#   cpu1:
#     type: cpu
#     num_threads: 3

detectors:
  ov:
    type: openvino
    device: GPU.0

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

objects:
  track:
    - person
    - car
    - dog
    - cat
    - bird

record:
  enabled: true
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14
  continuous:
    days: 0
  motion:
    days: 0

snapshots:
  enabled: true
  retain:
    default: 14

cameras:
  floodlight_front_driveway:
    ffmpeg:
      inputs:
        - path:
            rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.45:554/h264Preview_01_main
          roles:
            - record
        - path:
            rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.45:554/h264Preview_01_sub
          roles:
            - detect
    detect:
      enabled: true
      width: 896
      height: 512
      fps: 2

    zones:
      driveway:
        coordinates: 0.401,0.003,0.208,1,0.813,1,0.596,0.01
        loitering_time: 0
        friendly_name: Driveway
