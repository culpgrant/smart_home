services:
  # Main home assistant
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2025.10.4
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Chicago
    restart: unless-stopped
    network_mode: host
    privileged: true

  # Matter server
  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    network_mode: host
    volumes:
      - ./matter_server_data:/data
    restart: unless-stopped
    # Only needed if commissioning Thread/BLE via USB radio
    # privileged: true
    # devices:
    #   - /dev/ttyUSB1:/dev/ttyUSB1
