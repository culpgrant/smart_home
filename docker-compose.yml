services:
  # Main home assistant
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.1.3
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Chicago
    restart: unless-stopped
    network_mode: host
    privileged: true

  # Matter server
  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    network_mode: host
    volumes:
      - ./matter_server_data:/data
    restart: unless-stopped
    # Only needed if commissioning Thread/BLE via USB radio
    # privileged: true
    # devices:
    #   - /dev/ttyUSB1:/dev/ttyUSB1

  # Adguard
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:80"   # host 3000 → container 80 Web UI - http://192.168.1.20:3000 (host machine IP Address)
      - "853:853/tcp" # DNS over TLS (optional)
      - "784:784/tcp" # DNS over HTTPS (optional)
    environment:
      - TZ=America/Chicago

  # Smart Home jobs
  smart_home_jobs:
    container_name: smart_home_jobs
    build:
      context: .
      dockerfile: Dockerfile.smart_home_jobs
    volumes:
      - ./config/bash_wrappers:/logs
      - ./:/opt/smart_home
    environment:
      - PYTHONPATH=/opt/smart_home/src
      - SPOTIFY_REFRESH_TOKEN
      - SPOTIFY_CLIENT_SECRET
    entrypoint: ["uv", "run", "/opt/smart_home/src/smart_home/jobs/q101_spotify.py"]
    restart: "no"
