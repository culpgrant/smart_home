- id: '1779049301093'
  alias: Arm Away on Departure
  description: Arms in Away mode when everyone leaves home, between 8am and 10pm.
    Sends confirmation.
  triggers:
  - entity_id:
    - zone.home
    below: 1
    trigger: numeric_state
    for:
      hours: 0
      minutes: 2
      seconds: 0
  conditions:
  - condition: and
    conditions:
    - condition: time
      after: 08:00:00
      before: '22:00:00'
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
  actions:
  - target:
      entity_id: alarm_control_panel.alarmo
    action: alarm_control_panel.alarm_arm_away
    data: {}
  - wait_for_trigger:
    - trigger: event
      event_type: alarmo_failed_to_arm
    - trigger: state
      entity_id:
      - alarm_control_panel.alarmo
      to:
      - armed_away
    timeout:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger is not none and wait.trigger.platform ==
          ''state'' }}

          '
      sequence:
      - action: notify.mobile_app_grants_iphone
        data:
          title: "\U0001F512 Alarm Armed"
          message: Nobody home — armed in Away mode.
    - conditions:
      - condition: template
        value_template: "{{ wait.trigger is not none and wait.trigger.platform ==
          'event'\n   and wait.trigger.event.event_type == 'alarmo_failed_to_arm'
          }}\n"
      sequence:
      - action: notify.mobile_app_grants_iphone
        data:
          title: ⚠️ Alarm Failed to Arm
          message: "{% set reason = wait.trigger.event.data.reason %} {% set sensors
            = wait.trigger.event.data.sensors | default([]) %} {% if reason == 'open_sensors'
            %}\n  Could not arm — the following sensors are open:\n  {{ sensors |
            map('state_attr', 'friendly_name') | join(', ') }}.\n{% elif reason ==
            'not_allowed' %}\n  Could not arm — arming is not allowed right now.\n{%
            else %}\n  Could not arm — reason: {{ reason }}.\n{% endif %}\n"
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger is none }}'
      sequence:
      - action: notify.mobile_app_grants_iphone
        data:
          title: ⚠️ Alarm Failed to Arm
          message: Could not arm — no response from Alarmo after 30 seconds.
  mode: single
- id: '1779049718671'
