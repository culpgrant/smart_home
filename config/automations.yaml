- id: '1779732944569'
  alias: Frigate - Security Alert Notification
  description: Sends rich notifications for Frigate detections when alarm is armed.
  triggers:
  - trigger: mqtt
    topic: frigate/events
    payload: new
    value_template: '{{ value_json.type }}'
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_away
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_night
  actions:
  - variables:
      camera: '{{ trigger.payload_json.after.camera }}'
      label: '{{ trigger.payload_json.after.label }}'
      score: '{{ (trigger.payload_json.after.score * 100) | round(0) }}%'
      event_id: '{{ trigger.payload_json.after.id }}'
      snapshot_url: https://so4weni0mzco14bvis6vf23hcn7k9zc5.ui.nabu.casa/api/frigate/notifications/{{
        event_id }}/snapshot.jpg
      clip_url: https://so4weni0mzco14bvis6vf23hcn7k9zc5.ui.nabu.casa/api/frigate/notifications/{{
        event_id }}/clip.mp4
      dashboard_url: https://so4weni0mzco14bvis6vf23hcn7k9zc5.ui.nabu.casa/security
  - action: notify.mobile_app_grants_iphone
    data:
      title: "\U0001F6A8 {{ label | title }} Detected"
      message: '{{ label | title }} detected on {{ camera | replace(''_'', '' '')
        | title }} ({{ score }} confidence)'
      data:
        image: '{{ snapshot_url }}'
        url: '{{ dashboard_url }}'
        actions:
        - action: URI
          title: View Clip
          uri: '{{ clip_url }}'
        - action: URI
          title: Open Dashboard
          uri: '{{ dashboard_url }}'
  mode: parallel
  max: 10
