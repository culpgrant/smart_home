- id: '1779048590987'
  alias: Auto Arm at Night
  description: Arms in Night mode if home, Away mode if not. Sends confirmation.
  triggers:
  - at: '22:00:00'
    trigger: time
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
  - at: '23:00:00'
    trigger: time
    weekday:
    - fri
    - sat
  conditions:
  - condition: state
    entity_id: alarm_control_panel.alarmo
    state:
    - disarmed
  actions:
  - choose:
    - alias: If Grant or Nicole is Home
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: person.grant
          state: home
        - condition: state
          entity_id: person.nicole
          state: home
      sequence:
      - target:
          entity_id: alarm_control_panel.alarmo
        action: alarm_control_panel.alarm_arm_night
        data: {}
      - wait_for_trigger:
        - trigger: event
          event_type: alarmo_failed_to_arm
        - trigger: state
          entity_id: alarm_control_panel.alarmo
          to:
          - armed_night
          - arming
        timeout:
          seconds: 30
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.platform
              == ''state'' }}

              '
          sequence:
          - action: notify.mobile_app_grants_iphone
            data:
              message: Armed alarm in Sleep Mode.
              title: "\U0001F512 Alarm Armed"
        - conditions:
          - condition: template
            value_template: "{{ wait.trigger is not none and wait.trigger.platform
              == 'event'\n   and wait.trigger.event.event_type == 'alarmo_failed_to_arm'
              }}\n"
          sequence:
          - action: notify.mobile_app_grants_iphone
            data:
              title: ⚠️ Alarm Failed to Arm
              message: "{% set reason = wait.trigger.event.data.reason %} {% set sensors
                = wait.trigger.event.data.sensors | default([]) %} {% if reason ==
                'open_sensors' %}\n  Could not arm — the following sensors are open:\n
                \ {{ sensors | map('state_attr', 'friendly_name') | join(', ') }}.\n
                \ Please check before bed.\n{% elif reason == 'not_allowed' %}\n  Could
                not arm — arming is not allowed right now.\n{% else %}\n  Could not
                arm — reason: {{ reason }}.\n{% endif %}\n"
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is none }}'
          sequence:
          - action: notify.mobile_app_grants_iphone
            data:
              title: ⚠️ Alarm Failed to Arm
              message: 'Could not arm — no response from Alarmo after 30 seconds.

                '
  mode: single
- id: '1779048903611'
  alias: Auto Disarm in Morning
  description: Disarms at 6am on weekdays, 7am on weekends.
  triggers:
