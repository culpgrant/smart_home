- id: '1770689922217'
  alias: Garage Light Logic
  description: Turn on garage lights on activity, turn off after 10m of quiet.
  triggers:
  - trigger: state
    entity_id: binary_sensor.garage_occupancy
    to: 'on'
    id: motion_detected
  - trigger: state
    entity_id: binary_sensor.garage_occupancy
    to: 'off'
    for:
      minutes: 6
    id: motion_cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_detected
      sequence:
      - action: light.turn_on
        data: {}
        target:
          entity_id: light.garage_lights
    - conditions:
      - condition: trigger
        id: motion_cleared
      sequence:
      - action: light.turn_off
        data: {}
        target:
          entity_id: light.garage_lights
  mode: restart
- id: '1775406229860'
  alias: Laundry Room - Motion-Activated Lights (Dark Only)
  description: Turn on laundry room lights when motion is detected and it's dark
  triggers:
  - type: motion
    device_id: 294450f81b489e0afff6a7d6d772fd70
    entity_id: b01eb10e912b32645e417e3241b77d1c
    domain: binary_sensor
    trigger: device
  - type: opened
    device_id: 8db2603af9e6a10a830659ac21427a0c
    entity_id: b7f99b873186a2a5c49e2f2c6d5daacb
    domain: binary_sensor
    trigger: device
  conditions:
  - type: is_illuminance
    condition: device
    device_id: 294450f81b489e0afff6a7d6d772fd70
    entity_id: dbc6bb05c714e07d9158a36ffc1b7b65
    domain: sensor
    below: 40
  actions:
  - data:
      brightness_pct: 100
    action: light.turn_on
    target:
      device_id: e136bed98cc2df992a91d48636dce895
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.myggspray_wrlss_mtn_sensor_occupancy_2
      to:
      - 'off'
      for:
        minutes: 5
      trigger: state
  - target:
      device_id: e136bed98cc2df992a91d48636dce895
    action: light.turn_off
    data: {}
  mode: restart
