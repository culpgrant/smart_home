- id: '1766091303568'
  alias: Roomba Weekday Automation - Ask
  description: See if Roomba vacuum should run on first floor
  triggers:
  - trigger: time
    at: 09:00:00
    weekday:
    - mon
    - wed
    - fri
  conditions: []
  actions:
  - action: notify.mobile_app_grants_iphone
    metadata: {}
    data:
      title: Run Roomba?
      message: Do you want to start the Roomba now?
      data:
        tag: roomba_prompt
        actions:
        - action: ROOMBA_YES
          title: 'YES'
        - action: ROOMBA_NO
          title: 'NO'
  - wait_for_trigger:
    - event_type: mobile_app_notification_action
      event_data:
        action: ROOMBA_YES
      trigger: event
    - event_type: mobile_app_notification_action
      event_data:
        action: ROOMBA_NO
      trigger: event
    timeout: 00:15:00
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ wait.trigger is not none and\n   wait.trigger.event.data.action
          == 'ROOMBA_YES' }}\n"
      sequence:
      - target:
          entity_id: vacuum.roomba_694
        action: vacuum.start
      - data:
          message: Roomba started.
        action: notify.mobile_app_grants_iphone
    - conditions:
      - condition: template
        value_template: "{{ wait.trigger is not none and\n   wait.trigger.event.data.action
          == 'ROOMBA_NO' }}\n"
      sequence:
      - data:
          message: Roomba skipped for today.
        action: notify.mobile_app_grants_iphone
  mode: single
