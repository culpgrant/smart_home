repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # - id: check-yaml
      #   args: [--unsafe] (waiting for prek to add this) # For Home assistant custom yaml tags
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-yaml
      args: ['--unsafe']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.9
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
